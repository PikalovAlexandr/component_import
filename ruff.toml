# Конфигурация ruff для проекта component_import.
# Философия: ловим реальные баги (F — пироманские ошибки, unused, undefined) и
# устаревший синтаксис (UP — pyupgrade), но НЕ навязываем стилистические предпочтения
# (авторский стиль с компактными `import os, sys` и `s.validate(); s.group()`
# сохраняем — это не дефекты, тесты зелёные).

target-version = "py310"
line-length = 100
extend-exclude = ["tests/golden_k50", "stage0_kit_v1.1"]

[lint]
# Активные группы правил:
#   F    — pyflakes: unused imports/variables, undefined names (реальные баги)
#   UP   — pyupgrade: упрощение устаревшего синтаксиса
#   B    — flake8-bugbear: вероятные ошибки (изменяемые аргументы по умолчанию и т.п.)
#   C4   — comprehensions
select = ["F", "UP", "B", "C4"]

# Игнорируем стилистические привычки автора (не баги, рабочий код):
#   E401  — несколько импортов в одной строке (`import os, sys`)
#   E701  — несколько операторов через двоеточие (`if x: do()`)
#   E702  — несколько операторов через точку с запятой (`a(); b()`)
#   E731  — lambda-присваивание (`f = lambda x: ...`)
#   E741  — двусмысленное имя (l, I, O)
ignore = ["E401", "E701", "E702", "E731", "E741",
          # Доброкачественные срабатывания на существующем коде (перепроверено):
          "B007",  # _acc: неиспользуемая переменная цикла в rules.py (читаемость)
          "B023",  # замыкание regex в dual.py — ложное срабатывание (рекомпиляция в каждой итерации)
          "B905",  # zip(doc.keys, key) в tudoc.py — длины гарантированно равны (диагностика)
          "C408",  # dict(...) в тесте как конструктор записи — читаемее, чем литерал
]

[lint.per-file-ignores]
# В тестах допускаем длинные строки с данными и неиспользуемые имена фикстур
"tests/**/*.py" = ["E501"]
