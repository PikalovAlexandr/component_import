# Золотые тесты (ПИ-1…ПИ-6) на каждый push/PR — главный актив проекта.
# Эталонные данные (tests/golden_k50) лежат в репозитории: CI самодостаточен.
name: tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Установка пакета и зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Золотые тесты (ПИ-1…ПИ-6)
        run: python -m pytest tests/ -v
      - name: Дымовой прогон CLI на golden-наборе
        run: |
          component-import tests/golden_k50 -o /tmp/ci_run --lib-name K50-35 \
            --field-map config/field_map_pcad.csv \
            --tu config/tu_OZh0464214.yaml --dry-run
          test -f "/tmp/ci_run/ОТЧЁТ_K50-35.md"
