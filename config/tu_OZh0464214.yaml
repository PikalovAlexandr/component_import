# Эталон документа ТУ (В-7). Черновик таблицы построен по распознанному PDF;
# спорные строки подтверждает библиотекарь по оригиналу (ОП п.5).
doc: "ОЖ0.464.214 ТУ"
table: tu_OZh0464214.csv
key_regex: '^K50-35(?P<Серия>А|Б)?-(?P<U>[\d,]+)В-(?P<C>[\d,]+)$'
checks:
  - {column: Масса,  field: Масса,  tolerance: "1%"}
  - {column: Высота, field: Высота, tolerance: "-0.5..+2.5"}
footprint_checks:
  name_regex: '^(?P<D>[\d.]+)X(?P<A>[\d.]+)'
  d_column: D
  d_tolerance: "-0.1..+1.1"
  pitch_by_d: [[8, 2.5], [14, 5], [21, 7.5]]
